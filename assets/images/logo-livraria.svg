    <path d="M -28 -2 C -18 -9 -9 -9 -3 -3" fill="none" stroke="#C9A227" stroke-width="1.5"/>
    <path d="M -28 5 C -18 -2 -9 -2 -3 4" fill="none" stroke="#C9A227" stroke-width="1.5"/>
    <path d="M 28 -2 C 18 -9 9 -9 3 -3" fill="none" stroke="#C9A227" stroke-width="1.5"/>
    <path d="M 28 5 C 18 -2 9 -2 3 4" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  </g>

  <!-- Hands cradling the book -->
  <g fill="#666">
    <path d="M -52 28 C -52 14 -42 6 -30 8 L -30 26 C -38 22 -46 26 -48 36 C -50 44 -46 50 -38 52 L -8 56 L -8 64 L -42 60 C -54 58 -60 46 -52 28 Z"/>
    <path d="M 52 28 C 52 14 42 6 30 8 L 30 26 C 38 22 46 26 48 36 C 50 44 46 50 38 52 L 8 56 L 8 64 L 42 60 C 54 58 60 46 52 28 Z"/>
