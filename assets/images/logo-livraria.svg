<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logótipo Livraria em Suas Mãos">
  <defs>
    <path id="arcTop" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <path id="arcBottom" d="M 42 138 A 58 58 0 0 0 158 138" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#F8F6F0" stroke="#666" stroke-width="3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <text font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#666">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">LIVRARIA EM SUAS MÃOS</textPath>
  </text>
  <text font-family="Georgia, serif" font-size="10" letter-spacing="1.5" fill="#999">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">ABRA PORTAS PARA MUNDOS</textPath>
  </text>

  <!-- Open book -->
